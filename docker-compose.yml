# Kodomo server stack: PostgreSQL + Redis + MinIO + NestJS API + Next.js super-admin dashboard.
# Usage: cp backend/.env.example .env  (set JWT_SECRET!)  &&  docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kodomo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kodomo}
      POSTGRES_DB: kodomo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodomo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-kodomo}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-kodomo-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    environment:
      PORT: 3000
      DATABASE_URL: postgres://kodomo:${POSTGRES_PASSWORD:-kodomo}@postgres:5432/kodomo
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-kodomo}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-kodomo-secret}
      MINIO_BUCKET: kodomo-media
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/kodomo-media}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE:-kodomo-otp}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    ports: ["3000:3000"]

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-/api/v1}
        API_PROXY_TARGET: http://api:3000
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:3000/live}
    depends_on: [api]
    ports: ["3001:3001"]

volumes:
  pgdata:
  redisdata:
  miniodata:
